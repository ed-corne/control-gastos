<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Control de Gastos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4a37">
  <link rel="icon" type="image/x-icon" href="icono.ico">
  <link rel="apple-touch-icon" href="icono-256.png">
  <!-- Aplica el tema guardado antes de pintar, para que no haya un parpadeo de claro a oscuro. -->
  <script>
    (function () {
      var tema = null;
      try { tema = localStorage.getItem('tema'); } catch (e) {}
      var oscuro = tema ? tema === 'oscuro' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

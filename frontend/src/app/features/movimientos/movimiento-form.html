@if (estado.formularioAbierto()) {
  <div class="fixed inset-0 z-50 flex items-end justify-center sm:items-center" role="dialog" aria-modal="true" [attr.aria-label]="titulo()">
    <button type="button" class="absolute inset-0 bg-black/50" (click)="cerrar()" aria-label="Cerrar formulario"></button>

    <form class="relative grid max-h-[92dvh] w-full max-w-lg gap-4 overflow-y-auto rounded-t-3xl border border-line bg-surface p-4 shadow-2xl sm:rounded-3xl sm:p-6"
          [formGroup]="form" (ngSubmit)="guardar()">
      <header class="flex items-center justify-between">
        <h2 class="text-lg font-semibold text-ink">{{ titulo() }}</h2>
        <button type="button" class="btn-icon" (click)="cerrar()" aria-label="Cerrar"><app-icon name="cerrar" /></button>
      </header>

      <!-- Tipo -->
      <div class="grid grid-cols-3 gap-1 rounded-xl border border-line bg-bg p-1" role="group" aria-label="Tipo de movimiento">
        @for (t of tipos; track t) {
          <button type="button" (click)="cambiarTipo(t)" [attr.aria-pressed]="tipo() === t"
                  class="min-h-10 rounded-lg px-2 text-sm font-medium transition-colors"
                  [class.bg-danger]="tipo() === t && t === 'Gasto'"
                  [class.bg-success]="tipo() === t && t === 'Ingreso'"
                  [class.bg-primary]="tipo() === t && t === 'Transferencia'"
                  [class.text-bg]="tipo() === t && t !== 'Transferencia'"
                  [class.text-on-primary]="tipo() === t && t === 'Transferencia'"
                  [class.text-muted]="tipo() !== t">
            {{ t }}
          </button>
        }
      </div>

      <label class="field">
        <span class="field-label">Monto</span>
        <input class="input !text-2xl !font-semibold" type="number" inputmode="decimal" step="0.01" min="0.01"
               formControlName="monto" placeholder="0.00" autofocus />
      </label>

      @if (tipo() !== 'Transferencia') {
        <div class="field">
          <span class="field-label">Categoría</span>
          @if (frecuentes().length) {
            <div class="flex flex-wrap gap-2">
              @for (c of frecuentes(); track c.id) {
                <button type="button" (click)="elegirCategoria(c.id)" [attr.aria-pressed]="form.controls.categoriaId.value === c.id"
                        class="inline-flex min-h-9 items-center gap-1.5 rounded-full border px-3 text-sm text-ink transition-colors"
                        [class.border-primary]="form.controls.categoriaId.value === c.id"
                        [class.bg-primary-soft]="form.controls.categoriaId.value === c.id"
                        [class.border-line]="form.controls.categoriaId.value !== c.id">
                  <app-icon [name]="c.icono" [size]="16" /> {{ c.nombre }}
                </button>
              }
            </div>
          }
          <select class="input" formControlName="categoriaId" aria-label="Categoría">
            <option value="">Selecciona…</option>
            @for (c of categorias(); track c.id) {
              <option [value]="c.id">{{ c.nombre }}</option>
            }
          </select>
        </div>
      }

      <label class="field">
        <span class="field-label">{{ tipo() === 'Transferencia' ? 'Cuenta de origen' : 'Cuenta' }}</span>
        <select class="input" formControlName="cuentaId">
          <option value="">Selecciona…</option>
          @for (c of cuentas(); track c.id) {
            <option [value]="c.id">{{ c.nombre }}</option>
          }
        </select>
      </label>

      @if (tipo() === 'Transferencia') {
        <label class="field">
          <span class="field-label">Cuenta destino</span>
          <select class="input" formControlName="cuentaDestinoId">
            <option value="">Selecciona…</option>
            @for (c of cuentas(); track c.id) {
              @if (c.id !== form.controls.cuentaId.value) {
                <option [value]="c.id">{{ c.nombre }}</option>
              }
            }
          </select>
        </label>
      }

      <div class="grid gap-4 sm:grid-cols-2">
        <label class="field">
          <span class="field-label">Fecha</span>
          <input class="input" type="date" formControlName="fecha" [max]="hoy" />
        </label>
        <label class="field">
          <span class="field-label">Descripción (opcional)</span>
          <input class="input" type="text" formControlName="descripcion" maxlength="500" />
        </label>
      </div>

      @if (error()) {
        <p class="alert-error" role="alert">{{ error() }}</p>
      }

      <div class="flex justify-end gap-2">
        <button type="button" class="btn" (click)="cerrar()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="guardando()">Guardar</button>
      </div>
    </form>
  </div>
}
